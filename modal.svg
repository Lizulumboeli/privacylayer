<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
  <!-- Backdrop -->
  <rect width="560" height="620" fill="#000" fill-opacity="0.75"/>
  <rect width="560" height="620" fill="#0a0c10"/>

  <!-- Modal container -->
  <g transform="translate(40, 30)">
    <!-- Modal background with subtle glow -->
    <rect x="0" y="0" width="480" height="560" rx="16" fill="#0f1117" stroke="#1e2330" stroke-width="1"/>
    <rect x="-1" y="-1" width="482" height="562" rx="17" fill="none" stroke="#00e5a0" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(20, 20)">
      <!-- Shield icon -->
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#00e5a0" fill-opacity="0.08" stroke="#00e5a0" stroke-opacity="0.2"/>
      <text x="22" y="30" font-size="22" text-anchor="middle">🛡️</text>

      <!-- Title -->
      <text x="56" y="20" font-size="15" font-weight="600" fill="#e2e8f0">PII Detected</text>
      <text x="56" y="38" font-size="12" fill="#64748b">PrivacyLayer found sensitive data in your prompt</text>

      <!-- Close button -->
      <text x="420" y="26" font-size="14" fill="#475569" text-anchor="middle">✕</text>
    </g>

    <!-- Divider -->
    <line x1="0" y1="84" x2="480" y2="84" stroke="#1e2330"/>

    <!-- Findings list -->
    <g transform="translate(16, 100)">
      <!-- Finding 1: IBAN (Critical) -->
      <rect x="0" y="0" width="448" height="44" rx="8" fill="#161b27" stroke="#1e2330"/>
      <text x="14" y="28" font-size="16">🏦</text>
      <text x="40" y="20" font-size="11" fill="#64748b" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">IBAN / BANK ACCOUNT</text>
      <rect x="40" y="24" width="180" height="14" rx="3" fill="rgba(255,255,255,0.04)"/>
      <text x="46" y="34" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">GB82WEST12345698765432</text>
      <rect x="370" y="14" width="64" height="18" rx="9" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-opacity="0.27"/>
      <text x="402" y="26" font-size="9" fill="#ef4444" text-anchor="middle" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">CRITICAL</text>

      <!-- Finding 2: Email (High) -->
      <rect x="0" y="52" width="448" height="44" rx="8" fill="#161b27" stroke="#1e2330"/>
      <text x="14" y="80" font-size="16">✉️</text>
      <text x="40" y="72" font-size="11" fill="#64748b" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">EMAIL ADDRESS</text>
      <rect x="40" y="76" width="150" height="14" rx="3" fill="rgba(255,255,255,0.04)"/>
      <text x="46" y="86" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">giorgi@company.com</text>
      <rect x="380" y="66" width="54" height="18" rx="9" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-opacity="0.27"/>
      <text x="407" y="78" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">HIGH</text>

      <!-- Finding 3: Phone (High) -->
      <rect x="0" y="104" width="448" height="44" rx="8" fill="#161b27" stroke="#1e2330"/>
      <text x="14" y="132" font-size="16">📞</text>
      <text x="40" y="124" font-size="11" fill="#64748b" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">PHONE NUMBER</text>
      <rect x="40" y="128" width="120" height="14" rx="3" fill="rgba(255,255,255,0.04)"/>
      <text x="46" y="138" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">+1-555-867-5309</text>
      <rect x="380" y="118" width="54" height="18" rx="9" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-opacity="0.27"/>
      <text x="407" y="130" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" letter-spacing="0.06em">HIGH</text>
    </g>

    <!-- Masked Preview -->
    <g transform="translate(16, 264)">
      <rect x="0" y="0" width="448" height="100" rx="8" fill="#00e5a0" fill-opacity="0.04" stroke="#00e5a0" stroke-opacity="0.15"/>
      <text x="12" y="20" font-size="10" fill="#00e5a0" fill-opacity="0.6" font-family="'IBM Plex Mono', monospace" letter-spacing="0.08em">MASKED PROMPT PREVIEW</text>
      <text x="12" y="44" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">Please draft a payment confirmation for Giorgi.</text>
      <text x="12" y="62" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">His IBAN is <tspan fill="#00e5a0">[IBAN_1]</tspan> and his email is <tspan fill="#00e5a0">[EMAIL_1]</tspan>.</text>
      <text x="12" y="80" font-size="11" fill="#94a3b8" font-family="'IBM Plex Mono', monospace">Phone: <tspan fill="#00e5a0">[PHONE_1]</tspan></text>
    </g>

    <!-- Action buttons -->
    <g transform="translate(16, 386)">
      <!-- Cancel button -->
      <rect x="0" y="0" width="216" height="42" rx="8" fill="transparent" stroke="#2d3748"/>
      <text x="108" y="26" font-size="13" fill="#64748b" text-anchor="middle">✕  Send original anyway</text>

      <!-- Confirm button -->
      <rect x="232" y="0" width="216" height="42" rx="8" fill="#00e5a0" fill-opacity="0.1" stroke="#00e5a0" stroke-opacity="0.35"/>
      <text x="340" y="26" font-size="13" fill="#00e5a0" text-anchor="middle" font-weight="500">🛡️  Send masked version</text>
    </g>

    <!-- Footer -->
    <line x1="0" y1="460" x2="480" y2="460" stroke="#1a1f2e"/>
    <text x="240" y="486" font-size="11" fill="#334155" text-anchor="middle" font-family="'IBM Plex Mono', monospace">All data processed locally · Nothing sent to PrivacyLayer servers</text>
  </g>
</svg>
